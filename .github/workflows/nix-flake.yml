name: "Nix Flake"
on:
  push:
    branches: main
  pull_request:
  merge_group:
    branches: main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - uses: actions/checkout@v7

    # Cache the nix store between runs on the Linux leg.  After
    # `nix build .` the store holds the ledger build together with the
    # semantic-bisimulation oracle and its Mathlib artifact tree (the
    # ledger-semantics flake's `deps` fixed-output derivation, about
    # 10 GB on disk), and fetching and validating that tree is what
    # makes a cold run slow.  No store-size cap is set on purpose:
    # `nix build .` roots only the ledger output, whose closure does
    # not contain the oracle, the Mathlib tree or the Lean toolchain
    # (they are check-time inputs), so a pre-save garbage collection
    # deletes exactly those paths first -- the previous 8G cap did so
    # on every run and saved a 160 MB cache that could never help.
    # flake.lock pins the semantics revision, so the key follows every
    # Lean upgrade, and `deps` is content-addressed, so a cache restored
    # by prefix stays valid until that pin moves.  Only pushes to main
    # save, so pull requests restore main's cache instead of each
    # saving a copy under their own ref.  GitHub grants a repository
    # 10 GB of Actions cache in total, which is why only one leg gets
    # the cache; the macOS leg fetches the Mathlib artifacts each run.
    - uses: nix-community/cache-nix-action@v7
      if: runner.os == 'Linux'
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        save: ${{ github.event_name == 'push' }}
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never

    - name: Install lefthook
      run: npm install -g lefthook

    # `nix build .` builds the C++ ledger AND runs its full ctest
    # suite in the check phase — including SemanticBisimulation, which
    # replays every positive test journal against the Lean oracle
    # (test/semantic/check_all.py).  The oracle and its toolchain come
    # from the ledger-semantics flake input (its deps and oracle
    # packages), so this job
    # is the CI gate for the bisimulation: any balance divergence
    # between the C++ implementation and the Lean semantics fails it.
    - name: Ensure nix flake builds (includes Lean bisimulation)
      run: lefthook run nix-flake-build
