name: Fuzz

on:
  schedule:
    - cron: '0 3 * * *'  # Nightly at 3am UTC
  workflow_dispatch:       # Allow manual triggering

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
        name: Check out repository code

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo ./acprep dependencies

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_FUZZING=ON -DBUILD_LIBRARY=ON

      - name: Build fuzzer
        run: cmake --build ${{github.workspace}}/build --target journal_fuzzer

      - name: Check that libledger is instrumented
        working-directory: ${{github.workspace}}/build
        run: |
          # The parser lives in libledger; without SanitizerCoverage and ASan
          # hooks there, libFuzzer sees only the harness's own edges.
          for sym in __sanitizer_cov_ __asan_report_; do
            if ! nm -D libledger.so | grep -q "$sym"; then
              echo "::error::libledger.so has no $sym* references; it was built without fuzzer instrumentation"
              exit 1
            fi
          done

      - name: Run fuzzer
        working-directory: ${{github.workspace}}/build
        run: |
          mkdir -p fuzz-findings
          ./journal_fuzzer \
            ${{github.workspace}}/test/fuzz/corpus/ \
            -max_len=65536 \
            -timeout=10 \
            -max_total_time=1800 \
            -artifact_prefix=fuzz-findings/ \
            2>&1 | tee fuzz-output.log
        continue-on-error: true

      - name: Check for fuzzer findings
        working-directory: ${{github.workspace}}/build
        run: |
          shopt -s nullglob
          findings=(fuzz-findings/{crash,leak,timeout,oom}-*)
          if (( ${#findings[@]} )); then
            echo "::error::Fuzzer found failures: ${findings[*]}"
            ls -la fuzz-findings/
            exit 1
          fi
          if ! grep -q '^Done [0-9]* runs in' fuzz-output.log; then
            echo "::error::Fuzzer did not finish its run; see fuzz-output.log"
            exit 1
          fi
          echo "No findings"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-findings
          path: |
            ${{github.workspace}}/build/fuzz-findings/
            ${{github.workspace}}/build/fuzz-output.log
          retention-days: 30
          if-no-files-found: ignore
